name: Release

# Publishes a GitHub release for the versionName in app/build.gradle.kts, with the release APK.
# Start it from the Actions tab ("Run workflow"), or push a tag v<versionName>.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          [ -n "$version" ] || { echo "::error::versionName not found in app/build.gradle.kts"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleRelease
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apk="Abfahrten-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          # Creates the tag v$VERSION on this commit if it does not exist yet; fails if the release already exists.
          gh release create "v$VERSION" "$apk" --target "$GITHUB_SHA" --title "Abfahrten $VERSION" --generate-notes
